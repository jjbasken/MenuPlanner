# Included into every location that sets headers of its own.
#
# nginx's add_header does NOT inherit into a block that has its own add_header
# directive, so a server-level list would be silently dropped by the locations
# that set Cache-Control. Keeping the list in one file and including it
# per-location makes that failure mode impossible to reintroduce.
#
# The bearer token lives in localStorage, so script injection would be an
# account takeover; the CSP keeps every script first-party. Fonts are bundled by
# Vite, so no third-party origins are needed. 'unsafe-inline' applies to styles
# only (React style attributes).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
# Sent unconditionally: TLS is terminated upstream (Cloudflare Tunnel), so this
# server cannot tell an HTTPS request from a plaintext one.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
